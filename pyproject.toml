[project]
name = "eyes-mcp"
version = "0.1.0"
description = "Give any text-only LLM eyes - local vision (VLM + OCR) for coding agents, via MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JamesbbBriz" }]
keywords = ["mcp", "vision", "ocr", "llama-cpp", "vlm", "local", "text-only"]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "rapidocr>=3.0",
    "onnxruntime>=1.28.0",
]

[project.urls]
Homepage = "https://github.com/JamesbbBriz/eyes-mcp"
Issues = "https://github.com/JamesbbBriz/eyes-mcp/issues"

[project.scripts]
eyes-mcp = "eyes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyes_mcp"]
